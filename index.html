<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Value-first, not brand-first: this page should rank for "try Nostr",
         never compete for other teams' client names (see public/robots.txt). -->
    <meta
      name="description"
      content="Feel what Nostr is like before you commit to a client — interactive, in-browser simulations with mock data. No keys, no signup, no install."
    />
    <title>Sandstr — Try Nostr clients, no keys, no install</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B10" />

    <!--
      og:image is regenerated from scripts/og-image.html — see the comment in that
      file. Once the production domain is fixed, make og:image and og:url absolute:
      some scrapers (Twitter in particular) will not resolve a relative image path.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sandstr" />
    <meta property="og:title" content="Sandstr — Try Nostr clients, no keys, no install" />
    <meta
      property="og:description"
      content="Interactive, in-browser simulations of real Nostr clients. Unofficial, mock data, not affiliated."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Sandstr logo above the line: try Nostr clients in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
