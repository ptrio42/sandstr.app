<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Value-first, not brand-first: this page should rank for "try Nostr",
         never compete for other teams' client names (see public/robots.txt). -->
    <meta
      name="description"
      content="Feel what Nostr is like before you commit to a client — interactive, in-browser simulations with mock data. No keys, no signup, no install."
    />
    <title>Sandstr — Try Nostr clients, no keys, no install</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B10" />

    <!--
      Production domain is sandstr.app (2026-08-03). og:image and og:url are
      absolute because some scrapers (Twitter in particular) will not resolve a
      relative image path. og:image itself is regenerated from
      scripts/og-image.html — see the comment in that file.

      og:url and canonical are deliberately hard-pinned to the gallery rather
      than tracking the current route: /c/ is Disallow'd in public/robots.txt on
      purpose (a pixel-faithful /c/damus must not rank for "Damus"), so pointing
      every deep link at "/" is the same call, expressed to crawlers.
    -->
    <link rel="canonical" href="https://sandstr.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sandstr" />
    <meta property="og:url" content="https://sandstr.app/" />
    <meta property="og:title" content="Sandstr — Try Nostr clients, no keys, no install" />
    <meta
      property="og:description"
      content="Interactive, in-browser simulations of real Nostr clients. Unofficial, mock data, not affiliated."
    />
    <meta property="og:image" content="https://sandstr.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Sandstr logo above the line: try Nostr clients in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Structured data describes SANDSTR ONLY. The reproduced clients are
      deliberately absent: marking up Damus or Primal as software this site
      offers is exactly the identity confusion the rest of the strategy avoids
      (robots.txt Disallow'ing /c/, the SIMULATION banner, the outbound
      handoff). No aggregateRating either — there are no ratings, and inventing
      them would be the one lie a reviewer can check in a search result.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://sandstr.app/#website",
            "url": "https://sandstr.app/",
            "name": "Sandstr",
            "description": "Feel what Nostr is like before you commit to a client — interactive, in-browser simulations with mock data. No keys, no signup, no install.",
            "inLanguage": "en",
            "creator": { "@id": "https://sandstr.app/#creator" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://sandstr.app/#app",
            "name": "Sandstr",
            "url": "https://sandstr.app/",
            "description": "Interactive, in-browser reproductions of real Nostr clients, running entirely on the visitor's device. Unofficial and not affiliated with the clients it depicts.",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Any (runs in a web browser)",
            "browserRequirements": "Requires JavaScript.",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "license": "https://opensource.org/licenses/MIT",
            "isPartOf": { "@id": "https://sandstr.app/#website" },
            "creator": { "@id": "https://sandstr.app/#creator" }
          },
          {
            "@type": "Person",
            "@id": "https://sandstr.app/#creator",
            "name": "ptrio42"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The build injects the GALLERY's markup into #root (scripts/prerender.mjs).
      The SPA fallback (wrangler.jsonc, not_found_handling) serves this same
      file for every deep link, so without the line below someone opening a
      shared /c/damus would stare at the gallery until the bundle boots and
      React replaces it — the wrong page, on the exact entry path people arrive
      by. Classic inline script, not a module: it runs during parsing, before
      first paint and before the deferred bundle. On `/` it does nothing, which
      is where crawlers look.
    -->
    <script>
      if (location.pathname !== '/' && location.pathname !== '/index.html') {
        document.getElementById('root').textContent = '';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
